name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -iE "error|exception|FAILED|what went wrong" build.log | tail -40 | while IFS= read -r line; do
            escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::$escaped"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ott-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
